version: "3.9"

services:
  app:
    build: .
    container_name: vegetable_app
    ports:
      - "3000:3000"
    depends_on:
      - mongo
    environment:
      - MONGO_URI=mongodb://mongo:27017/vegetableDB
    restart: always

  mongo:
    image: mongo:6
    container_name: vegetable_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

volumes:
  mongo_data:
